# Bookplate — self-hosted ebook library
# Usage: docker compose up -d   (then open http://localhost:8480)
services:
  bookplate:
    image: ghcr.io/bacnh85/bookplate:latest
    ports:
      - "8480:8480"
    volumes:
      - bookplate-data:/app/data   # named volume: correct ownership on first boot
                                   # (bind ./data:/app/data works too, but on Linux
                                   # pre-create it: mkdir -p data && chown 1000:1000 data)
    restart: unless-stopped
    # optional provider keys (env replaces the dev .env.local):
    # environment:
    #   ZAI_API_KEY: ...            # AI metadata fallback
    #   ZLIB_EMAIL: ...             # Z-Library account (search/download)
    #   ZLIB_PASSWORD: ...
    #   ZLIB_DOMAIN: https://z-lib.gd   # optional; only if the default mirror rots
    #   ANNAS_ARCHIVE_SECRET_KEY: ...   # Anna's Archive member key (search/download)
    #   ANNAS_BASE_URL: https://annas-archive.gd   # optional; only if the mirror rots

volumes:
  bookplate-data:
    name: bookplate-data   # pin the real name (compose would otherwise prefix it
                           # with the checkout dir) so the README migration
                           # command's -v bookplate-data targets THIS volume
