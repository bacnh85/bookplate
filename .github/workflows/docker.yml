name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # build the image, boot it, run the existing e2e selftest against it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build (amd64)
        run: docker build -t bookplate:test .
      - name: Start container
        run: docker run -d -p 8480:8480 --name bookplate bookplate:test
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8480/ >/dev/null && exit 0
            sleep 1
          done
          docker logs bookplate
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run e2e selftest against the container
        run: |
          pip install -r requirements.txt
          python scripts/selftest.py http://localhost:8480
      - name: Verify container-created files are 0600
        run: |
          MODE=$(docker exec bookplate stat -c '%a' /app/data/.secret)
          echo "/app/data/.secret mode: $MODE"
          [ "$MODE" = "600" ]

  publish:
    # multi-arch image to GHCR: linux/amd64 + linux/arm64
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
