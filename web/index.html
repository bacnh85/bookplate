<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookplate — your ebook library</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<section id="auth-view" hidden>
  <h1 class="wordmark">Bookplate<span>.</span></h1>
  <form id="auth-form">
    <input type="email" id="auth-email" placeholder="Email" autocomplete="username" required>
    <input type="password" id="auth-pass" placeholder="Password" autocomplete="current-password" required>
    <div class="error-line" id="auth-error" role="alert"></div>
    <button class="btn-primary" id="auth-submit" type="submit">Sign in</button>
    <button class="btn-ghost" id="auth-toggle" type="button">New here? Create an account</button>
  </form>
</section>

<section id="app-view" hidden>
  <header>
    <h1 class="wordmark">Bookplate<span>.</span></h1>
    <button class="btn-ghost active" id="tab-shelf" type="button">My shelf</button>
    <button class="btn-ghost" id="tab-find" type="button" title="Search Z-Library">Find books</button>
    <button class="btn-ghost" id="downloads-btn" type="button">Downloads<span id="downloads-badge" hidden></span></button>
    <span class="spacer"></span>
    <button class="btn-primary" id="upload-btn" type="button">Add books</button>
    <input type="file" id="file-input" class="visually-hidden" multiple accept=".pdf,.epub,.mobi,.azw3,.fb2,.cbz">
    <span id="user-email" class="result-sub"></span>
    <button class="btn-ghost" id="logout-btn" type="button">Sign out</button>
  </header>

  <main>
    <div id="shelf-view">
      <div class="toolbar">
        <input type="text" id="search" placeholder="Search title, author, category…" autocomplete="off">
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="shelf-empty" hidden>Your shelf is empty.<small>Add books, or use Find books to pull them from Z-Library.</small></div>
    </div>

    <div id="find-view" hidden>
      <div class="toolbar">
        <input type="text" id="zlib-search" placeholder="Search Z-Library…" autocomplete="off">
      </div>
      <div class="error-line" id="zlib-error"></div>
      <div class="results" id="zlib-results"></div>
    </div>
  </main>
</section>

<dialog id="share-dialog">
  <form method="dialog">
    <h2>Share this book</h2>
    <input type="email" id="share-email" placeholder="user@email" required>
    <div class="error-line" id="share-error"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end">
      <button class="btn-ghost" value="cancel" type="submit">Cancel</button>
      <button class="btn-primary" value="ok" id="share-ok" type="button">Share</button>
    </div>
  </form>
</dialog>

<dialog id="detail-dialog">
  <button class="btn-ghost detail-close" id="detail-close" type="button" aria-label="Close">✕</button>
  <div class="detail-head">
    <div class="detail-cover"><img id="detail-cover" alt=""></div>
    <div class="detail-info">
      <h2 id="detail-title" class="detail-title"></h2>
      <div id="detail-authors" class="detail-authors"></div>
      <div class="detail-actions">
        <button class="btn-primary" id="detail-download" type="button">Download</button>
        <a class="btn-ghost" id="detail-zlib" target="_blank" rel="noopener" hidden>Open on Z-Library</a>
      </div>
      <div id="detail-quota" class="result-sub"></div>
      <div id="detail-error" class="error-line" role="alert"></div>
    </div>
  </div>
  <dl class="detail-facts" id="detail-facts"></dl>
  <p id="detail-desc" class="detail-desc"></p>
  <section id="detail-related" hidden>
    <h3 id="related-title"></h3>
    <div class="related-strip" id="related-strip"></div>
  </section>
</dialog>

<dialog id="downloads-dialog">
  <button class="btn-ghost detail-close" id="downloads-close" type="button" aria-label="Close">✕</button>
  <h2>Downloads</h2>
  <div id="downloads-quota" class="result-sub"></div>
  <div id="downloads-list"></div>
  <div class="empty" id="downloads-empty" hidden>Nothing queued.<small>Use Find books, then "Get later" on a result.</small></div>
</dialog>

<div id="transfers" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
