<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#F6F3EC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reader — Bookplate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css?v=10">
<link rel="preload" href="/fonts/Literata-VF.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: 'Literata';
    src: url('/fonts/Literata-VF.woff2') format('woff2');
    font-weight: 200 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Literata';
    src: url('/fonts/Literata-Italic-VF.woff2') format('woff2');
    font-weight: 200 900; font-style: italic; font-display: swap;
  }
  /* Vietnamese subset (same family — unicode-range merges with the latin files above) */
  @font-face {
    font-family: 'Literata';
    src: url('/fonts/Literata-VF-viet.woff2') format('woff2');
    font-weight: 200 900; font-style: normal; font-display: swap;
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  @font-face {
    font-family: 'Literata';
    src: url('/fonts/Literata-Italic-VF-viet.woff2') format('woff2');
    font-weight: 200 900; font-style: italic; font-display: swap;
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  /* safe-area insets, JS-overridable when the browser lies (iOS 26 Safari reports 0) */
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
          --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px); }
  body { display: flex; flex-direction: column; height: var(--app-h, 100dvh); overflow: hidden;
         -webkit-text-size-adjust: 100%; }
  /* Immersive chrome: bars overlay the page and auto-hide while reading */
  #top-bar, #bottom-bar {
    position: absolute; left: 0; right: 0; z-index: 10;
    background: var(--card);
    transition: transform .25s ease;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #top-bar {
    top: 0; display: flex; gap: 8px; align-items: center;
    padding: 8px 16px; padding-top: calc(8px + var(--safe-top));
    padding-left: max(16px, var(--safe-left)); padding-right: max(16px, var(--safe-right));
    border-bottom: 1px solid var(--line); box-shadow: var(--e-xs);
  }
  #bottom-bar {
    bottom: 0; display: grid; gap: 2px;
    padding: 6px 16px 10px; padding-bottom: calc(10px + var(--safe-bottom));
    padding-left: max(16px, var(--safe-left)); padding-right: max(16px, var(--safe-right));
    border-top: 1px solid var(--line); box-shadow: var(--e-xs);
  }
  body.chrome-hidden #top-bar { transform: translateY(-110%); }
  body.chrome-hidden #bottom-bar { transform: translateY(110%); }
  @media (prefers-reduced-motion: reduce) {
    #top-bar, #bottom-bar { transition: none; }
  }
  #top-bar button, #top-bar a, #bottom-bar button { border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; padding: 6px 8px; border-radius: var(--r-sm); touch-action: manipulation; }
  /* iOS 44px minimum touch targets on coarse pointers */
  @media (pointer: coarse) {
    #top-bar button, #top-bar a, #bottom-bar button { min-width: 44px; min-height: 44px; }
  }
  #top-bar button:hover, #bottom-bar button:hover { background: var(--paper); }
  #top-bar button:disabled, #bottom-bar button:disabled { opacity: .4; cursor: default; background: none; }
  #top-bar button:focus-visible, #top-bar a:focus-visible, #bottom-bar button:focus-visible,
  #seek:focus-visible, #type-panel select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #btn-back { text-decoration: none; font-size: 1.25rem; line-height: 1; padding: 6px 10px 6px 4px; }
  #title { flex: 1; text-align: center; font-family: var(--font-display); font-size: 1rem;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #theme-cycle { font-size: var(--fs-sm); color: var(--ink-soft); }
  #viewer { flex: 1; position: relative; overflow: hidden; }
  #viewer foliate-view { display: block; width: 100%; height: 100%; }
  #viewer iframe { width: 100%; height: 100%; border: 0; }
  .zone { position: absolute; top: 0; bottom: 0; z-index: 5; }
  #zone-left { left: 0; width: 25%; }
  #zone-right { right: 0; width: 25%; }
  #zone-center { left: 25%; width: 50%; }
  #section-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
                 font-size: var(--fs-sm); color: var(--ink-soft); min-height: 1.3em; }
  #section-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #progress { font-variant-numeric: tabular-nums; flex: none; }
  #nav-row { display: flex; align-items: center; gap: 8px; }
  #prev, #next { font-size: 1.25rem; line-height: 1; flex: none; }
  #seek-wrap { position: relative; flex: 1; height: 24px; }
  #ticks { position: absolute; left: 8px; right: 8px; top: calc(50% - 5px); bottom: calc(50% - 5px); pointer-events: none; }
  .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink-soft); opacity: .35; }
  #seek { display: block; width: 100%; height: 24px; margin: 0; position: relative; z-index: 1;
          appearance: none; -webkit-appearance: none; background: transparent; cursor: pointer; }
  #seek::-webkit-slider-runnable-track { height: 4px; background: var(--line); border-radius: 2px; }
  #seek::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 16px; height: 16px;
          margin-top: -6px; border-radius: 50%; background: var(--accent); border: 0; }
  #seek::-moz-range-track { height: 4px; background: var(--line); border-radius: 2px; }
  #seek::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 0; }
  select { font: inherit; max-width: 150px; }
  #toc { max-width: 130px; flex: 0 1 auto; min-width: 0; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
             align-items: center; justify-content: center; text-align: center; padding: 0 32px;
             color: var(--ink-soft); }
  #load-title { font-family: var(--font-display); font-size: 1.25rem; color: var(--ink); }
  #type-wrap { position: relative; }
  #type-panel {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 20; width: 224px;
    display: grid; gap: 12px; padding: 16px;
    background: var(--card); border-radius: var(--r-md); box-shadow: var(--e-md);
  }
  #type-panel label { display: flex; justify-content: space-between; align-items: center; gap: 8px;
                      font-size: var(--fs-sm); color: var(--ink-soft); }
  #type-panel .row { display: flex; gap: 4px; }
  /* PDF pages are raster canvases — themes apply as colour filters on the rendered book */
  body.reading-pdf[data-theme="night"] #viewer foliate-view { filter: invert(0.92) hue-rotate(180deg); }
  body.reading-pdf[data-theme="sepia"] #viewer foliate-view { filter: sepia(0.35); }
  /* selection pill + annotation panel */
  #sel-pop {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; z-index: 15;
    display: flex; gap: 4px; padding: 4px;
    background: var(--card); border-radius: var(--r-md); box-shadow: var(--e-md);
  }
  #sel-pop button, #anno-panel button { border: 0; background: none; color: var(--ink); font: inherit;
    cursor: pointer; padding: 6px 10px; border-radius: var(--r-sm); }
  #sel-pop button:hover { background: var(--paper); }
  #sel-pop button:disabled { opacity: .4; cursor: default; background: none; }
  #sel-pop button:focus-visible, #anno-panel button:focus-visible, #btn-bookmark:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }
  #btn-bookmark.active { color: var(--accent); }
  #anno-panel {
    position: absolute; right: 12px; bottom: 64px; z-index: 15; width: min(320px, calc(100vw - 24px));
    max-height: 55vh; display: flex; flex-direction: column;
    background: var(--card); border-radius: var(--r-md); box-shadow: var(--e-md); overflow: hidden;
  }
  #anno-head { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid var(--line); font-family: var(--font-display); }
  #anno-list { overflow-y: auto; padding: 4px 0; }
  .anno-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
    font-size: var(--fs-sm); }
  .anno-row:hover { background: var(--paper); }
  .anno-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .anno-del { flex: none; opacity: .5; }
  .anno-del:hover { opacity: 1; color: var(--danger); }
  .anno-empty { padding: 16px 12px; color: var(--ink-soft); font-size: var(--fs-sm); }
  #anno-foot { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; }
  #anno-foot button { color: var(--accent); font-size: var(--fs-sm); }
  /* in-book search */
  #search-panel {
    position: absolute; right: 12px; bottom: 64px; z-index: 15; width: min(340px, calc(100vw - 24px));
    max-height: 60vh; display: flex; flex-direction: column;
    background: var(--card); border-radius: var(--r-md); box-shadow: var(--e-md); overflow: hidden;
  }
  #search-bar { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
  #search-input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 10px; }
  #search-input:focus { outline: none; border-color: var(--accent); }
  #search-bar button { border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer;
    padding: 6px 8px; border-radius: var(--r-sm); }
  #search-bar button:hover { background: var(--paper); }
  #search-bar button:disabled { opacity: .4; cursor: default; background: none; }
  #search-bar button:focus-visible, .search-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #search-status { padding: 6px 12px; font-size: var(--fs-sm); color: var(--ink-soft); min-height: 1.2em; }
  #search-results { overflow-y: auto; padding: 2px 0; }
  .search-row { display: block; width: 100%; text-align: left; border: 0; background: none;
    color: var(--ink); font: inherit; padding: 8px 12px; cursor: pointer; }
  .search-row:hover { background: var(--paper); }
  .search-label { display: block; font-size: var(--fs-sm); color: var(--ink-soft); margin-bottom: 2px; }
  .search-excerpt { font-size: var(--fs-sm); }
  .search-excerpt mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 2px; }
  #btn-search.active { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { #sel-pop, #anno-panel, #search-panel { transition: none; } }
</style>
</head>
<body>
<div id="viewer">
  <div class="zone" id="zone-left" hidden></div>
  <div class="zone" id="zone-center" hidden></div>
  <div class="zone" id="zone-right" hidden></div>
  <div id="sel-pop" hidden>
    <button id="sel-highlight" type="button">Highlight</button>
    <button id="sel-note" type="button">Note…</button>
  </div>
  <div id="anno-panel" hidden>
    <div id="anno-head"><span>Highlights &amp; bookmarks</span>
      <button id="anno-close" type="button" aria-label="Close">×</button></div>
    <div id="anno-list"></div>
    <div id="anno-foot"><button id="anno-export" type="button">Export notes</button></div>
  </div>
  <div id="search-panel" hidden>
    <div id="search-bar">
      <input id="search-input" type="search" placeholder="Search in book…" aria-label="Search in book">
      <button id="search-go" type="button" aria-label="Search">⌕</button>
      <button id="search-close" type="button" aria-label="Close search">×</button>
    </div>
    <div id="search-status"></div>
    <div id="search-results"></div>
  </div>
  <div id="loading">
    <div id="load-title">…</div>
    <div id="load-sub">Opening…</div>
  </div>
</div>
<div id="top-bar">
  <a id="btn-back" href="/" aria-label="Back to shelf">←</a>
  <div id="title">…</div>
  <button id="theme-cycle" type="button" aria-label="Cycle reading theme">Day</button>
  <span id="type-wrap">
    <button id="type-btn" type="button" aria-label="Typography">Aa</button>
    <div id="type-panel" hidden>
      <label>Font <select id="font-family">
        <option value="literata">Literata</option>
        <option value="georgia">Georgia</option>
        <option value="sans">Sans</option>
      </select></label>
      <label>Size <span class="row">
        <button class="btn-ghost" id="font-dec" type="button" aria-label="Smaller text">A−</button>
        <button class="btn-ghost" id="font-inc" type="button" aria-label="Larger text">A+</button>
      </span></label>
      <label>Leading <select id="line-height">
        <option value="1.5">Tight</option>
        <option value="1.6">Normal</option>
        <option value="1.8">Loose</option>
      </select></label>
      <label>Alignment <select id="align">
        <option value="justify">Justified</option>
        <option value="left">Left</option>
      </select></label>
      <label>Margin <select id="page-margin">
        <option value="16px">Narrow</option>
        <option value="48px">Normal</option>
        <option value="96px">Wide</option>
      </select></label>
      <label>Layout <select id="flow">
        <option value="paginated">Pages</option>
        <option value="scrolled">Scroll</option>
      </select></label>
    </div>
  </span>
  <select id="toc" hidden><option value="">Contents…</option></select>
</div>
<div id="bottom-bar">
  <div id="section-row">
    <span id="section-label"></span>
    <span id="progress"></span>
  </div>
  <div id="nav-row">
    <button id="prev" type="button" aria-label="Previous page">←</button>
    <button id="btn-bookmark" type="button" aria-label="Toggle bookmark">🔖</button>
    <button id="btn-anno" type="button" aria-label="Highlights and bookmarks">✎</button>
    <button id="btn-search" type="button" aria-label="Search in book">🔍</button>
    <button id="btn-tts" type="button" aria-label="Read aloud">▶</button>
    <button id="btn-tts-stop" type="button" aria-label="Stop reading" hidden>⏹</button>
    <div id="seek-wrap">
      <div id="ticks"></div>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Reading position">
    </div>
    <button id="next" type="button" aria-label="Next page">→</button>
  </div>
</div>
<script type="module" src="/reader.js?v=17"></script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () =>
  navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>
